title: blackhawk0x
tagline: security researcher & ctf player
description: >-
  Writeups, malware analysis, and reverse engineering notes by blackhawk0x.
author: blackhawk0x
email: lalitkandpallalit@gmail.com

url: "https://blackhawk0x.github.io"
baseurl: ""

github_username: blackhawk0x
discord_username: ""

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    block:
      line_numbers: false

highlighter: rouge
permalink: /posts/:slug/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
